# Parse the Worker source and run the offline test suite on every PR.
name: SDK CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "20"

      # The Worker has no dependencies and no lockfile, so there is nothing to
      # install: "npm ci" would fail and is deliberately not run here.
      - name: Check the Worker parses as JavaScript
        run: npm run lint

      - name: Run offline tests
        run: npm test
